# ===================================================
# Production Docker Compose for Coolify (Glodaxia News)
# Un solo contenedor: FrankenPHP + Horizon + Scheduler via supervisord
# ===================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - auto_https=off
    volumes:
      - storage_data:/app/storage/app
      - logs_data:/app/storage/logs
    networks:
      - glodaxia_network

volumes:
  storage_data:
  logs_data:

networks:
  glodaxia_network:
    driver: bridge
