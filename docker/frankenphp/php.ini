; ==============================================
; PHP Production Config for FrankenPHP + Laravel
; ==============================================

; Configuracion basica
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 100M
post_max_size = 100M

; OpCache para maximo performance
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.fast_shutdown=1
opcache.enable_cli=1
opcache.jit_buffer_size=256M
opcache.jit=1255

; PRODUCCION: No exponer errores a usuarios
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /app/storage/logs/php-errors.log

; Configuracion de fecha
date.timezone = UTC

; Configuracion para PostgreSQL
pgsql.ignore_notice = 0
pgsql.log_notice = 0

; Sesiones manejadas por Laravel via Redis driver (no por PHP directamente)
; No se necesita session.save_handler ni session.save_path aqui
